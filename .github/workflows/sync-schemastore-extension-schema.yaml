name: Sync extension schema to SchemaStore

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.28.2)'
        required: true
      schemastore_repository:
        description: 'SchemaStore repository to update (owner/repo)'
        required: false
        default: 'SchemaStore/schemastore'
      schemastore_base_branch:
        description: 'Base branch in the SchemaStore repository'
        required: false
        default: 'master'
      create_pr:
        description: 'Create a pull request after pushing the branch'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      schemaMinorVersion: ${{ steps.version.outputs.schemaMinorVersion }}
      isOfficialRelease: ${{ steps.version.outputs.isOfficialRelease }}
    steps:
      - name: Resolve tag and release type
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${{ github.event.release.prerelease }}" = "true" ] || [ "${{ github.event.release.draft }}" = "true" ]; then
              echo "Skipping prerelease/draft release."
              echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          IS_OFFICIAL_RELEASE="true"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag '$TAG'. Expected stable semver format: v<major>.<minor>.<patch>."
            echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          SCHEMA_MINOR_VERSION="${MAJOR}.${MINOR}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "schemaMinorVersion=${SCHEMA_MINOR_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "isOfficialRelease=${IS_OFFICIAL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved schema source tag: ${TAG}"

  sync-schemastore:
    name: Sync schema to SchemaStore
    runs-on: ubuntu-24.04
    needs: prepare
    if: needs.prepare.outputs.isOfficialRelease == 'true'
    permissions:
      contents: read
    env:
      SCHEMASTORE_TOKEN: ${{ secrets.PODMAN_DESKTOP_BOT_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SCHEMA_MINOR_VERSION: ${{ needs.prepare.outputs.schemaMinorVersion }}
      SCHEMA_FILE_NAME: podman-desktop-extension.json
      VERSIONED_SCHEMA_FILE_NAME: podman-desktop-extension-${{ needs.prepare.outputs.schemaMinorVersion }}.json
      SCHEMASTORE_STABLE_URL: https://www.schemastore.org/podman-desktop-extension.json
      SCHEMASTORE_VERSIONED_URL: https://www.schemastore.org/podman-desktop-extension-${{ needs.prepare.outputs.schemaMinorVersion }}.json
      SCHEMASTORE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_repository || 'SchemaStore/schemastore' }}
      SCHEMASTORE_BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_base_branch || 'master' }}
      CREATE_PR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_pr || 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate local schema file exists
        run: |
          if [ ! -f "schemas/extension-schema.json" ]; then
            echo "Missing schemas/extension-schema.json in release tag ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout SchemaStore repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SCHEMASTORE_REPOSITORY }}
          token: ${{ env.SCHEMASTORE_TOKEN }}
          path: schemastore
          ref: ${{ env.SCHEMASTORE_BASE_BRANCH }}

      - name: Apply schema updates
        working-directory: schemastore
        run: |
          set -euo pipefail

          cp ../schemas/extension-schema.json "src/schemas/json/${SCHEMA_FILE_NAME}"
          cp ../schemas/extension-schema.json "src/schemas/json/${VERSIONED_SCHEMA_FILE_NAME}"

          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          catalog_path = Path("src/api/json/catalog.json")
          stable_url = os.environ["SCHEMASTORE_STABLE_URL"]
          versioned_url = os.environ["SCHEMASTORE_VERSIONED_URL"]
          schema_minor_version = os.environ["SCHEMA_MINOR_VERSION"]
          name_marker = '"name": "Podman Desktop Extension"'

          text = catalog_path.read_text(encoding="utf-8")
          marker_index = text.find(name_marker)
          if marker_index == -1:
            print("Podman Desktop catalog entry is missing in SchemaStore.")
            print("Please merge the one-time bootstrap PR first.")
            sys.exit(1)

          object_start = text.rfind("{", 0, marker_index)
          if object_start == -1:
            print("Could not locate start of Podman Desktop catalog object.")
            sys.exit(1)

          in_string = False
          escaped = False
          depth = 0
          object_end = -1

          for index in range(object_start, len(text)):
            char = text[index]
            if in_string:
              if escaped:
                escaped = False
              elif char == "\\":
                escaped = True
              elif char == '"':
                in_string = False
              continue

            if char == '"':
              in_string = True
            elif char == "{":
              depth += 1
            elif char == "}":
              depth -= 1
              if depth == 0:
                object_end = index
                break

          if object_end == -1:
            print("Could not locate end of Podman Desktop catalog object.")
            sys.exit(1)

          block = text[object_start : object_end + 1]
          block = re.sub(r'("url"\s*:\s*")[^"]+(")', rf'\1{stable_url}\2', block, count=1)

          version_key = f'"{schema_minor_version}"'
          version_line_regex = rf'({re.escape(version_key)}\s*:\s*")[^"]+(")'

          if re.search(version_line_regex, block):
            block = re.sub(version_line_regex, rf"\1{versioned_url}\2", block, count=1)
          elif '"versions": {' in block:
            versions_start = block.find('"versions": {')
            brace_start = block.find("{", versions_start)

            in_string = False
            escaped = False
            depth = 0
            versions_end = -1

            for index in range(brace_start, len(block)):
              char = block[index]
              if in_string:
                if escaped:
                  escaped = False
                elif char == "\\":
                  escaped = True
                elif char == '"':
                  in_string = False
                continue
              if char == '"':
                in_string = True
              elif char == "{":
                depth += 1
              elif char == "}":
                depth -= 1
                if depth == 0:
                  versions_end = index
                  break

            if versions_end == -1:
              print("Could not locate versions object closing brace.")
              sys.exit(1)

            versions_body = block[brace_start + 1 : versions_end]
            close_line_start = block.rfind("\n", 0, versions_end) + 1
            close_indent = re.match(r"\s*", block[close_line_start:versions_end]).group(0)
            entry_indent = f"{close_indent}  "
            new_entry = f'{entry_indent}"{schema_minor_version}": "{versioned_url}"'

            if versions_body.strip():
              replacement_body = f"{versions_body.rstrip()},\n{new_entry}\n{close_indent}"
            else:
              replacement_body = f"\n{new_entry}\n{close_indent}"

            block = f"{block[:brace_start + 1]}{replacement_body}{block[versions_end:]}"
          else:
            close_line_start = block.rfind("\n", 0, len(block) - 1) + 1
            close_indent = re.match(r"\s*", block[close_line_start : len(block) - 1]).group(0)
            block_prefix = block[:close_line_start].rstrip()
            block = (
              f"{block_prefix},\n"
              f'{close_indent}  "versions": {{\n'
              f'{close_indent}    "{schema_minor_version}": "{versioned_url}"\n'
              f"{close_indent}  }}\n"
              f"{close_indent}}}"
            )

          updated = f"{text[:object_start]}{block}{text[object_end + 1:]}"
          catalog_path.write_text(updated, encoding="utf-8")
          PY

      - name: Push branch and optionally create SchemaStore pull request
        working-directory: schemastore
        env:
          GH_TOKEN: ${{ env.SCHEMASTORE_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH_NAME="podman-desktop-extension-schema-${RELEASE_TAG#v}-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH_NAME}"

          git config user.name "podman-desktop-bot"
          git config user.email "podman-desktop-bot@users.noreply.github.com"

          git add "src/schemas/json/${SCHEMA_FILE_NAME}" "src/schemas/json/${VERSIONED_SCHEMA_FILE_NAME}" src/api/json/catalog.json

          if git diff --cached --quiet; then
            echo "No changes detected for SchemaStore sync."
            exit 0
          fi

          git commit -m "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}"
          git push origin "${BRANCH_NAME}"

          if [ "${CREATE_PR}" != "true" ]; then
            echo "Skipping PR creation because create_pr=${CREATE_PR}"
            exit 0
          fi

          gh pr create \
            --repo "${SCHEMASTORE_REPOSITORY}" \
            --title "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}" \
            --body "Sync schema from podman-desktop/podman-desktop ${RELEASE_TAG}. This updates both stable and version-specific SchemaStore schema URLs." \
            --base "${SCHEMASTORE_BASE_BRANCH}" \
            --head "${BRANCH_NAME}"
