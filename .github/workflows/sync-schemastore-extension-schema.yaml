name: Sync extension schema to SchemaStore

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.28.2)'
        required: true
      schemastore_repository:
        description: 'SchemaStore repository to update (owner/repo)'
        required: false
        default: 'SchemaStore/schemastore'
      schemastore_base_branch:
        description: 'Base branch in the SchemaStore repository'
        required: false
        default: 'master'
      create_pr:
        description: 'Create a pull request after pushing the branch'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      schemaMinorVersion: ${{ steps.version.outputs.schemaMinorVersion }}
      isOfficialRelease: ${{ steps.version.outputs.isOfficialRelease }}
    steps:
      - name: Resolve tag and release type
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${{ github.event.release.prerelease }}" = "true" ] || [ "${{ github.event.release.draft }}" = "true" ]; then
              echo "Skipping prerelease/draft release."
              echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          IS_OFFICIAL_RELEASE="true"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag '$TAG'. Expected stable semver format: v<major>.<minor>.<patch>."
            echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          SCHEMA_MINOR_VERSION="${MAJOR}.${MINOR}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "schemaMinorVersion=${SCHEMA_MINOR_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "isOfficialRelease=${IS_OFFICIAL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved schema source tag: ${TAG}"

  sync-schemastore:
    name: Sync schema to SchemaStore
    runs-on: ubuntu-24.04
    needs: prepare
    if: needs.prepare.outputs.isOfficialRelease == 'true'
    environment: ${{ github.event_name == 'release' && 'npmjs-publication' || '' }}
    permissions:
      contents: read
    env:
      SCHEMASTORE_TOKEN: ${{ secrets.PODMAN_DESKTOP_BOT_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SCHEMA_MINOR_VERSION: ${{ needs.prepare.outputs.schemaMinorVersion }}
      SCHEMA_FILE_NAME: podman-desktop-extension.json
      VERSIONED_SCHEMA_FILE_NAME: podman-desktop-extension-${{ needs.prepare.outputs.schemaMinorVersion }}.json
      SCHEMASTORE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_repository || 'SchemaStore/schemastore' }}
      SCHEMASTORE_BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_base_branch || 'master' }}
      CREATE_PR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_pr || 'true' }}
      SOURCE_REPOSITORY: podman-desktop/podman-desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate local schema file exists
        run: |
          if [ ! -f "schemas/extension-schema.json" ]; then
            echo "Missing schemas/extension-schema.json in release tag ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout SchemaStore repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SCHEMASTORE_REPOSITORY }}
          token: ${{ env.SCHEMASTORE_TOKEN }}
          path: schemastore
          ref: ${{ env.SCHEMASTORE_BASE_BRANCH }}

      - name: Apply schema updates
        working-directory: schemastore
        run: |
          set -euo pipefail

          cp ../schemas/extension-schema.json "src/schemas/json/${SCHEMA_FILE_NAME}"
          cp ../schemas/extension-schema.json "src/schemas/json/${VERSIONED_SCHEMA_FILE_NAME}"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          schema_dir = Path("src/schemas/json")
          stable_file = schema_dir / os.environ["SCHEMA_FILE_NAME"]
          versioned_file = schema_dir / os.environ["VERSIONED_SCHEMA_FILE_NAME"]

          stable_id = "https://json.schemastore.org/podman-desktop-extension.json"
          versioned_id = f"https://json.schemastore.org/{os.environ['VERSIONED_SCHEMA_FILE_NAME']}"

          for file_path, schema_id in ((stable_file, stable_id), (versioned_file, versioned_id)):
            text = file_path.read_text(encoding="utf-8")

            # Keep SchemaStore file style and patch minimally.
            if '"$id":' not in text:
              text = text.replace(
                '  "$schema": "http://json-schema.org/draft-07/schema#",\n',
                f'  "$schema": "http://json-schema.org/draft-07/schema#",\n  "$id": "{schema_id}",\n',
                1,
              )
            else:
              text = re.sub(r'  "\$id": ".*?",\n', f'  "$id": "{schema_id}",\n', text, count=1)

            # SchemaStore validation does not resolve cross-schema refs here.
            text = text.replace(
              '    {\n      "$ref": "https://json.schemastore.org/package.json"\n    },\n',
              "",
              1,
            )

            file_path.write_text(text, encoding="utf-8")
          PY

      - name: Push branch and optionally create SchemaStore pull request
        working-directory: schemastore
        env:
          GH_TOKEN: ${{ env.SCHEMASTORE_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH_NAME="podman-desktop-extension-schema-${RELEASE_TAG#v}-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH_NAME}"

          git config user.name "podman-desktop-bot"
          git config user.email "podman-desktop-bot@users.noreply.github.com"

          git add "src/schemas/json/${SCHEMA_FILE_NAME}" "src/schemas/json/${VERSIONED_SCHEMA_FILE_NAME}"

          if git diff --cached --quiet; then
            echo "No changes detected for SchemaStore sync."
            exit 0
          fi

          git commit -m "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}"
          git push origin "${BRANCH_NAME}"

          if [ "${CREATE_PR}" != "true" ]; then
            echo "Skipping PR creation because create_pr=${CREATE_PR}"
            exit 0
          fi

          gh pr create \
            --repo "${SCHEMASTORE_REPOSITORY}" \
            --title "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}" \
            --body "Sync schema from podman-desktop/podman-desktop ${RELEASE_TAG}. This updates the stable and version-specific schema files without touching catalog.json." \
            --base "${SCHEMASTORE_BASE_BRANCH}" \
            --head "${BRANCH_NAME}"
