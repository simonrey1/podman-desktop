name: Sync extension schema to SchemaStore

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.28.2)'
        required: true
      schemastore_repository:
        description: 'SchemaStore repository to update (owner/repo)'
        required: false
        default: 'SchemaStore/schemastore'
      schemastore_base_branch:
        description: 'Base branch in the SchemaStore repository'
        required: false
        default: 'master'
      create_pr:
        description: 'Create a pull request after pushing the branch'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      schemaMinorVersion: ${{ steps.version.outputs.schemaMinorVersion }}
      schemaFileName: ${{ steps.version.outputs.schemaFileName }}
      isOfficialRelease: ${{ steps.version.outputs.isOfficialRelease }}
    steps:
      - name: Resolve tag and release type
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${{ github.event.release.prerelease }}" = "true" ] || [ "${{ github.event.release.draft }}" = "true" ]; then
              echo "Skipping prerelease/draft release."
              echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          IS_OFFICIAL_RELEASE="true"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag '$TAG'. Expected stable semver format: v<major>.<minor>.<patch>."
            echo "isOfficialRelease=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          SCHEMA_MINOR_VERSION="${MAJOR}.${MINOR}"
          SCHEMA_FILE_NAME="podman-desktop-extension-${SCHEMA_MINOR_VERSION}.json"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "schemaMinorVersion=${SCHEMA_MINOR_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "schemaFileName=${SCHEMA_FILE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "isOfficialRelease=${IS_OFFICIAL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved schema target: ${SCHEMA_FILE_NAME}"

  sync-schemastore:
    name: Sync schema to SchemaStore
    runs-on: ubuntu-24.04
    needs: prepare
    if: needs.prepare.outputs.isOfficialRelease == 'true'
    permissions:
      contents: read
    env:
      SCHEMASTORE_TOKEN: ${{ secrets.PODMAN_DESKTOP_BOT_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SCHEMA_MINOR_VERSION: ${{ needs.prepare.outputs.schemaMinorVersion }}
      SCHEMA_FILE_NAME: ${{ needs.prepare.outputs.schemaFileName }}
      SCHEMASTORE_SCHEMA_URL: https://www.schemastore.org/${{ needs.prepare.outputs.schemaFileName }}
      SCHEMASTORE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_repository || 'SchemaStore/schemastore' }}
      SCHEMASTORE_BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.schemastore_base_branch || 'master' }}
      CREATE_PR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_pr || 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate local schema file exists
        run: |
          if [ ! -f "schemas/extension-schema.json" ]; then
            echo "Missing schemas/extension-schema.json in release tag ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout SchemaStore repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SCHEMASTORE_REPOSITORY }}
          token: ${{ env.SCHEMASTORE_TOKEN }}
          path: schemastore
          ref: ${{ env.SCHEMASTORE_BASE_BRANCH }}

      - name: Apply schema and catalog updates
        working-directory: schemastore
        run: |
          set -euo pipefail

          cp ../schemas/extension-schema.json "src/schemas/json/${SCHEMA_FILE_NAME}"
          CATALOG_PATH="src/api/json/catalog.json"

          jq \
            --arg schemaUrl "${SCHEMASTORE_SCHEMA_URL}" \
            --arg schemaMinorVersion "${SCHEMA_MINOR_VERSION}" \
            '
            .schemas |= (
              if any(.[]; .name == "Podman Desktop Extension") then
                map(
                  if .name == "Podman Desktop Extension" then
                    .description = "Podman Desktop extension package.json manifest"
                    | .fileMatch = []
                    | .url = $schemaUrl
                    | .versions = ((.versions // {}) + {($schemaMinorVersion): $schemaUrl})
                  else
                    .
                  end
                )
              else
                . + [{
                  "name": "Podman Desktop Extension",
                  "description": "Podman Desktop extension package.json manifest",
                  "fileMatch": [],
                  "url": $schemaUrl,
                  "versions": {($schemaMinorVersion): $schemaUrl}
                }]
              end
            )
            ' "${CATALOG_PATH}" > "${CATALOG_PATH}.tmp"
          mv "${CATALOG_PATH}.tmp" "${CATALOG_PATH}"

      - name: Push branch and optionally create SchemaStore pull request
        working-directory: schemastore
        env:
          GH_TOKEN: ${{ env.SCHEMASTORE_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH_NAME="podman-desktop-extension-schema-${SCHEMA_MINOR_VERSION}-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH_NAME}"

          git config user.name "podman-desktop-bot"
          git config user.email "podman-desktop-bot@users.noreply.github.com"

          git add "src/schemas/json/${SCHEMA_FILE_NAME}" src/api/json/catalog.json

          if git diff --cached --quiet; then
            echo "No changes detected for SchemaStore sync."
            exit 0
          fi

          git commit -m "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}"
          git push origin "${BRANCH_NAME}"

          if [ "${CREATE_PR}" != "true" ]; then
            echo "Skipping PR creation because create_pr=${CREATE_PR}"
            exit 0
          fi

          gh pr create \
            --repo "${SCHEMASTORE_REPOSITORY}" \
            --title "Update Podman Desktop extension schema for ${SCHEMA_MINOR_VERSION}" \
            --body "Sync schema from podman-desktop/podman-desktop ${RELEASE_TAG}. This updates the Podman Desktop extension schema entry for ${SCHEMA_MINOR_VERSION}." \
            --base "${SCHEMASTORE_BASE_BRANCH}" \
            --head "${BRANCH_NAME}"
